情境。",subs:[{id:"aa1",label:"一般繼承",laws:[{code:"民法 §1138",title:"法定繼承人順序 ★",freq:"high",detail:`【全國法規原文】遺產繼承人，除配偶外，依左列順序定之：

一、與第一千一百三十八條所定第一順序之繼承人同為繼承時，其應繼分與他繼承人平均。
二、與第一千一百三十八條所定第二順序或第三順序之繼承人同為繼承時，其應繼分為遺產二分之一。
三、與第一千一百三十八條所定第四順序之繼承人同為繼承時，其應繼分為遺產三分之二。
四、無第一千一百三十八條所定第一順序至第四順序之繼承人時，其應繼分為遺產全部。`,key_paras:[1,2,3,4]},{code:"民法 §1148",title:"有限責任繼承（概括繼承）★",freq:"high",detail:`【全國法規原文】
第一項：繼承人自繼承開始時，除本法另有規定外，承受被繼承人財產上之一切權利、義務。但權利、義務專屬於被繼承人本身者，不在此限。
第二項：繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任。

※99年修法後，預設概括繼承有限責任，無須另行聲請。`,key_paras:[2]},{code:"土地法 §73",title:"繼承登記6個月期限 ★",freq:"high",detail:"【全國法規原文（繼承登記法令補充規定§2）】繼承登記應自繼承發生之日起六個月內申請，逾期者每逾一個月得處應納登記費額一倍之罰鍰，但最高不得超過二十倍。"},{code:"土地登記規則 §119",title:"繼承登記應附文件 ★",freq:"high",detail:`【全國法規原文】聲請繼承登記，應提出下列文件：
一、登記申請書。
二、登記清冊。
三、繼承系統表。
四、被繼承人除戶戶籍謄本及繼承人現在戶籍謄本。
五、遺產稅繳清證明書、免稅證明書、不計入遺產總額證明書或同意移轉證明書，其經財政部核定開徵遺產稅之地區，並應提出其中一種。
六、其他依法律或中央地政機關規定應提出之文件。`},{code:"遺贈稅法 §30",title:"遺產稅申報期限",freq:"mid",detail:`【全國法規原文】
第一項：被繼承人死亡遺有財產者，納稅義務人應於被繼承人死亡之日起六個月內，向戶籍所在地主管稽徵機關依本法規定辦理遺產稅申報。但依第六條第二項規定由稽徵機關申報者，不在此限。
第二項：被繼承人為經常居住中華民國境外之中華民國國民，或非中華民國國民死亡時在中華民國境內遺有財產者，應向臺北國稅局辦理遺產稅申報。

⚠️ 申報地點：①境內有戶籍→戶籍地國稅局②境外或外國人→臺北國稅局。期限均為6個月，可延長3個月。`}],docs:["全戶戶籍謄本（被繼承人除戶＋各繼承人現戶謄本）","繼承系統表（自製，全體繼承人簽名）","遺產稅完稅/免稅/不計入遺產總額證明書","土地/建物所有權狀（繳驗）","各繼承人身分證影本","地政士委任書"],notes:["需先向國稅局申報遺產稅並取得完稅證明，才能向地政事務所申請繼承登記","6個月期限從「除戶日（死亡登記日）」起算，逾期仍可辦理但需繳罰鍰","繼承人中有未成年者，若法定代理人同為繼承人，需聲請法院選任特別代理人"],exam:[{lv:"high",note:"配偶應繼分計算（民法§1144四款）——每年必出計算申論題"},{lv:"high",note:"繼承登記應附文件（土地登記規則§119各款）——申論、測驗均常考"},{lv:"high",note:"申請期限6個月、逾期罰鍰最高20倍"}]},{id:"aa2",label:"拋棄與代位繼承",laws:[{code:"民法 §1174",title:"拋棄繼承期限 ★",freq:"high",detail:`【全國法規原文】
第一項：繼承人得拋棄其繼承權。
第二項：前項拋棄，應於知悉其得繼承之時起三個月內，以書面向法院為之。
第三項：拋棄繼承後，應以書面通知因其拋棄而應為繼承之人。`,key_paras:[2,3]},{code:"民法 §1176",title:"拋棄後順位遞補 ★",freq:"high",detail:`【全國法規原文】
第一項：第一千一百三十八條所定第一順序之繼承人中有拋棄繼承權者，其應繼分歸屬於其他同為繼承之人。
第四項：同一順序之繼承人均拋棄其繼承權時，由次順序之繼承人繼承。其次順序繼承人有無不明或第四順序之繼承人均拋棄其繼承權者，準用關於無人承認繼承之規定。
第五項：配偶拋棄繼承權者，其應繼分歸屬於與其同為繼承之血親繼承人。`,key_paras:[1,4,5]},{code:"民法 §1140",title:"代位繼承（不適用拋棄）★",freq:"high",detail:`【全國法規原文】第一千一百三十八條所定第一順序之繼承人，有於繼承開始前死亡或喪失繼承權者，由其直系血親卑親屬代位繼承其應繼分。

⚠️ 拋棄繼承者的子女不能代位繼承！代位只適用「繼承開始前死亡」或「喪失繼承權」。`},{code:"土地登記規則 §120",title:"拋棄繼承登記附件 ★",freq:"high",detail:"【全國法規原文】繼承人有拋棄繼承者，應提出法院准予備查之文件。"}],docs:["法院拋棄繼承准予備查函（有拋棄繼承者必附）","代位繼承系統表（有代位繼承時）","其餘同一般繼承應備文件"],notes:["拋棄期限：知悉得繼承起3個月，向被繼承人最後住所地法院書面聲請","拋棄後不能反悔，法院備查後即生效","拋棄者子女不能代位繼承——代位只適用「死亡」或「喪失繼承權」"],exam:[{lv:"high",note:"拋棄繼承3個月期限（§1174第二項）及書面向法院程序"},{lv:"high",note:"代位繼承vs拋棄後子女能否代位（不能！）——超高頻陷阱辨析題"},{lv:"high",note:"拋棄後登記應附法院備查函（土地登記規則§120）"}]},{id:"aa3",label:"公同共有繼承",laws:[{code:"民法 §1151",title:"繼承前公同共有 ★",freq:"high",detail:"【全國法規原文】繼承人有數人時，在分割遺產前，各繼承人對於遺產全部為公同共有。"},{code:"民法 §828",title:"公同共有物處分限制 ★",freq:"high",detail:`【全國法規原文】
第二項：公同共有物之處分，及其他之權利行使，除法律另有規定外，應得公同共有人全體之同意。`},{code:"土地法 §34-1",title:"共有物處分多數決（完整六項）— 公同共有辨析 ★",freq:"high",detail:`【全國法規原文（完整六項）】
第一項：共有土地或建築改良物，其處分、變更及設定地上權、農育權、不動產役權或典權，應以共有人過半數及其應有部分合計過半數之同意行之。但其應有部分合計逾三分之二者，其人數不予計算。
第二項：共有人依前項規定為處分、變更或設定負擔時，應事先以書面通知他共有人；其不能以書面通知者，應公告之。
第三項：第一項共有人，對於他共有人應得之對價或補償，負連帶清償責任。於為權利變更登記時，並應提出他共有人已為受領或為其提存之證明。其因而取得不動產物權者，應代他共有人申請登記。
第四項：共有人出賣其應有部分時，他共有人得以同一價格共同或單獨優先承購。
第五項：前四項規定，於公同共有準用之。
第六項：依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後十五日內向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之。

⚠️ 本子類重點：
第五項明文規定：前四項「於公同共有準用之」→公同共有仍需全體同意（因公同共有之性質，不適用雙過半多數決）。
常考陷阱：公同共有繼承土地是否可用§34-1多數決？→不可，須全體同意。`,crossRef:"亦見 B類（優先購買權）、F類（共有分割）",key_paras:[5]}],docs:["遺產分割協議書（全體繼承人簽名蓋章，辦分割時用）","各繼承人印鑑證明","其餘同一般繼承應備文件"],notes:["公同共有人中任何一人不得單獨出售、設定抵押或處分其持分","須全體同意方可分割或處分，缺一不可","辦完分割登記後，才從公同共有變成分別共有，屆時才可適用土地法§34-1"],exam:[{lv:"high",note:"公同共有 vs 分別共有的處分規則——超高頻辨析題"},{lv:"high",note:"土地法§34-1不適用於公同共有——常見陷阱"}]},{id:"aa4",label:"未辦繼承（逾期）",laws:[{code:"土地法 §73-1",title:"15年列冊→標售 ★",freq:"high",detail:`【全國法規原文】
第一項：土地或建築改良物，自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於三個月內聲請登記，並以書面通知繼承人；逾期仍未聲請者，得由地政機關予以列冊管理。

第二項：租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項規定，終止契約。其租金約定分期支付者，其遲付租金之總額未達二個月之租額，亦同。`,key_paras:[1,2]},{code:"民法 §442",title:"房屋租賃終止通知期限",freq:"mid",detail:"【全國法規原文】租用房屋，如未定期限者，各當事人得隨時終止契約。但有利於承租人之習慣者，從其習慣。前項終止契約，應依習慣先期通知，其期限在都市及鄉村地區分別依習慣為之；如無習慣，出租人應先期通知承租人，期限為一個月。"}],docs:["租賃契約書（不動產租賃標準契約）","押金收據","房屋稅籍資料","房東身分證明","地政士委任書（如需公證）"],notes:["租賃期限超過1年：需以書面為之（民法§422，口頭視為不定期限）","買賣不破租賃（§425）：房子賣掉，租約對新房東仍有效——房客受保護","房屋押金上限：《租賃住宅市場發展及管理條例》規定不得超過2個月租金","遲繳租金：房屋租賃累積逾2個月才可終止（§440第二項）","包租代管：不動產租賃住宅服務業管理條例規範"],exam:[{lv:"high",note:"買賣不破租賃（§425）：原則+例外（未公證超過5年或未定期限）"},{lv:"high",note:"房屋租賃終止：遲付租金須累積達2個月（§440第二項）"},{lv:"mid",note:"租賃期限超過1年須書面（§422）；未書面視為不定期"}]},{id:"mm2",label:"耕地三七五減租",laws:[{code:"耕地三七五減租條例 §2",title:"最高佃租限制 ★",freq:"high",detail:`【全國法規原文】
第一項：耕地地租不得超過主要作物正產品全年收穫總量千分之三百七十五。已超過者，應即調整為千分之三百七十五；未及千分之三百七十五者，不得調整增加。

⚠️ 三七五減租：最高租額為主要農作物正產品全年收穫量的37.5%。這是法定上限，不得超過。`,key_paras:[1]},{code:"耕地三七五減租條例 §16",title:"出租耕地優先承受 ★",freq:"high",detail:`【全國法規原文】
第一項：耕地出賣或出典時，承租人有優先承受之權，出租人應將賣典條件以書面通知承租人，承租人在十五日內未以書面表示承受者，視為放棄。出租人因無人承買或受典而再行貶價出賣或出典時，仍應照前項規定辦理。
第二項：出租人違反前二項規定而與第三人訂立契約者，其契約不得對抗承租人。

⚠️ 三七五租約優先承受：通知15日（注意：土地法§107優先購買通知是10日，兩者不同！）`,key_paras:[1,2]},{code:"耕地三七五減租條例 §19",title:"租約不得轉租 ★",freq:"mid",detail:`【全國法規原文（節錄）】

一、承租人死亡而無繼承人或繼承人無耕作能力者。
二、承租人放棄耕作者。

本條例所稱：
一、公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地。
二、區分所有：指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權。
三、專有部分：指公寓大廈之全部或一部分，具有使用上之獨立性，且為區分所有之標的者。
四、共用部分：指公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者。
五、管理委員會：指為執行區分所有權人會議決議事項及公寓大廈管理維護工作，由區分所有權人選任住戶若干人為管理委員所設立之組織。`},{code:"公寓大廈管理條例 §25",title:"區分所有權人會議 ★",freq:"high",detail:`【全國法規原文（節錄）】
第一項：區分所有權人會議，由全體區分所有權人組成，每年至少召集一次。
第二項：有下列情形之一者，應召集臨時會議：一、發生重大事故有及時處理之必要。二、有區分所有權人五分之一以上及其區分所有權比例合計五分之一以上，以書面載明召集之目的及理由，請求召集者。

區分所有權人會議決議：
修繕費用支出超過新台幣一定金額：需出席人數過半及出席區分所有比例過半決議。
規約訂定/變更：出席人數3/4以上及出席比例3/4以上同意。`,key_paras:[1,2]},{code:"公寓大廈管理條例 §36",title:"管理委員會職掌 ★",freq:"high",detail:`【全國法規原文（節錄）】
第一項：管理委員會之職務如下：
一、區分所有權人會議決議事項之執行。
二、共有及共用部分之清潔、維護、修繕及一般改良。
三、公寓大廈及其周圍之安全及環境維護事項。
四、住戶違規情事之制止及相關資料之提供。
五、公共基金之收支、保管及運用。
六、規約、會議紀錄、使用執照謄本、竣工圖說及有關文件之保管。
七、管理服務人之委任、僱傭及監督。
八、其他依本條例或規約所定事項。`,key_paras:[1]}],docs:["公寓大廈規約","區分所有權人會議紀錄","管理委員會組織章程","公共基金收支帳冊"],notes:["管委會不具法人資格（無法律人格），但可以管委員會名義提起訴訟（§38）","規約：訂定需3/4特別決議（出席人數3/4且持有面積比例3/4）","停車位爭議：區分所有或共用？依設計圖及使照而定","裝修管理：需向管委會申請，並遵守噪音/施工時間限制"],exam:[{lv:"high",note:"公寓大廈管理條例§25區分所有權人會議召集（1/5申請臨時會議）"},{lv:"high",note:"規約訂定需3/4特別決議——113年經紀人考試重點"},{lv:"mid",note:"管委會八大職掌（§36）——列舉申論"}]},{id:"mm4",label:"不動產租賃住宅服務業",laws:[{code:"租賃住宅市場發展及管理條例 §3",title:"租賃住宅定義",freq:"low",detail:`【全國法規原文（節錄）】本條例所稱租賃住宅，指供居住使用且出租者。

第一項：租賃期間，租賃住宅因自然損耗或意外事故而需修繕，非可歸責於承租人者，由出租人負責修繕。

⚠️ 修繕義務：正常損耗由房東修；承租人故意/過失造成的損壞由房客賠償。`,key_paras:[1]}],docs:["租賃住宅標準契約（內政部公告版本）","押金收據"],notes:["押金最高2個月租金（法定上限）","包租業vs代管業：包租業是「二房東」（租來再轉租）；代管業是「管理員」（管理但不轉租）","租賃期間未屆滿提前終止：需有正當理由，否則違約賠償"],exam:[{lv:"high",note:"押金不得超過2個月租金（租賃住宅市場發展及管理條例§13）"},{lv:"mid",note:"包租業 vs 代管業的差異——經紀人考試"}]}]},bf={id:"n",icon:"ti-handshake",label:"N. 不動產仲介交易類",sub:"不動產說明書 / 要約書服務報酬 / 履約保證 / 預售屋管制",role:"broker",freq:"high",active:!0,desc:"不動產仲介交易法規是不動產經紀人考試的核心。不動產說明書義務、仲介費上限（買賣6%/租賃1.5個月）、預售屋禁換約（111年修法），近年考試頻率大增。",subs:[{id:"nn1",label:"不動產說明書",laws:[{code:"不動產經紀業管理條例 §23",title:"說明書應記載事項 ★",freq:"high",detail:`【全國法規原文（節錄）】
第一項：不動產說明書（應記載事項，依內政部公告格式）包含：
一、建物總面積（主建物/附屬建物/公設持分/私設通路）。
二、基地面積及使用分區。
三、建物現況（屋齡/有無違建/有無漏水/海砂/輻射/凶宅等）。
四、土地及建物之法定用途及現況用途。
五、道路種類（計畫道路/現有道路/私設道路）。
六、鄰近設施（嫌惡設施/交通設施）。
七、管理費及公共設施。
八、有無設定他項權利（抵押/租賃）。
九、水電、瓦斯、電信設施現況。
十、房地附贈設備清單。

⚠️ 說明書需在簽訂買賣契約前提供給買方，仲介負說明義務。`,key_paras:[1]},{code:"不動產經紀業管理條例 §24",title:"仲介業應盡之說明義務 ★",freq:"high",detail:`【全國法規原文（節錄）】
第一項：不動產經紀業就仲介或代銷之不動產，應就不動產說明書記載事項，向買受人說明。
第二項：不動產說明書應由地政士或經紀人員簽章。

⚠️ 仲介簽章責任：說明書需由地政士或有執照的不動產經紀人簽章，才具有效力。`,key_paras:[1,2]},{code:"消費者保護法 §22",title:"廣告視為要約（企業經營者廣告責任）★",freq:"high",detail:`【全國法規原文】
第一項：企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容。

⚠️ 廣告具有要約或引誘性質：不動產廣告所示的條件（面積/設備/格局），企業不得低於廣告承諾。
實務應用：建商廣告標榜「純住宅/無商業/游泳池」等，日後若未兌現，買方可依此主張。
罰則：不實廣告→違反消保法第22條→可請求損害賠償（§51最高3倍懲罰性賠償）。
注意：§22與不動產說明書義務（不動產經紀業管理條例§23）相輔相成，兩者均保護買方。`,crossRef:"亦見 N類（不動產說明書）"},{code:"不動產經紀業管理條例 §26",title:"仲介違反說明義務之損害賠償 ★",freq:"high",detail:`【全國法規原文（節錄）】
第一項：因可歸責於經紀業之事由不能履行委託契約，致委託人受損害時，由該經紀業負賠償責任；如因可歸責於經紀人員之事由者，由該經紀業與經紀人員負連帶賠償責任。`,key_paras:[1]}],docs:["不動產說明書（內政部公告格式）","地政士或不動產經紀人簽章","買賣契約書"],notes:["說明書義務：仲介在帶看前/簽約前需向買方詳細說明並要求買方簽收","凶宅揭露：仲介有義務揭露，不揭露可能構成欺詐","海砂屋/輻射屋：重大交易事項，仲介須告知","說明書不實→仲介負損害賠償責任（§26），且可能撤銷契約"],exam:[{lv:"high",note:"不動產說明書記載事項（§23）——經紀人考試申論必考"},{lv:"high",note:"說明書由地政士或不動產經紀人員簽章（§24第二項）"},{lv:"high",note:"仲介說明義務違反→連帶損害賠償（§26）"}]},{id:"nn2",label:"要約書與服務報酬",laws:[{code:"不動產經紀業管理條例 §22",title:"仲介服務報酬上限 ★",freq:"high",detail:`【全國法規原文（節錄）】
第一項：不動產經紀業向委託人收取報酬之總額，買賣不得超過成交價款百分之六，租賃不得超過一個半月租金總額。

買賣：成交價6%（通常買賣雙方各收2%~3%）
租賃：1.5個月租金（通常房東房客各收0.5個月）`,key_paras:[1]},{code:"不動產經紀業管理條例 §19",title:"斡旋金/要約書使用 ★",freq:"high",detail:`【全國法規原文（節錄）】
第一項：不動產經紀業者就買賣或租賃之居間，得收取斡旋金；但斡旋金不得超過成交價格之百分之三。斡旋金應以仲介業者名義存入金融機構。

實務使用方式：

⚠️ 要約書 vs 斡旋金：目前消保法第17條使用要約書較受保護，仲介使用哪種需清楚告知消費者。`,key_paras:[1]}],docs:["委託銷售契約書","不動產說明書","要約書（或斡旋金收據）","買賣契約書"],notes:["仲介費：買賣雙方合計不得超過成交價6%；租賃合計不得超過1.5個月租金","斡旋金：最高3%，需存入金融機構（不得放仲介口袋）","要約書vs斡旋金：法律上均有效，但消保法要求仲介告知差異讓消費者選擇","委任期間：委託銷售合約有期限，到期可換仲介或自售"],exam:[{lv:"high",note:"仲介服務報酬上限：買賣6%、租賃1.5個月（§22）——測驗必考數字"},{lv:"high",note:"斡旋金上限3%，且需存金融機構（§19）"},{lv:"mid",note:"要約書 vs 斡旋金的差異（消費者選擇權）"}]},{id:"nn3",label:"履約保證與信託",laws:[{code:"不動產經紀業管理條例 §26-1",title:"不動產交易履約保證 ★",freq:"high",detail:`【全國法規原文（節錄）】
第一項：不動產買賣或租賃業務，其交付款項之保管，應採信託方式或其他保障財務安全之方法，以確保交易安全。

履約保證四種方式（依規定）：
一、不動產買賣價款信託：買方款項存入信託專戶，交屋後撥付賣方。
二、不動產買賣價款融資：銀行提供融資擔保。

②標售前繼承人仍可申請，阻止標售進行
③標售後：繼承人有優先購買權，且10年內可申領標售所得價款

【關鍵】：被標售前任何時間都還可以辦，但辦理後要補繳土地法§73第二項罰鍰（每逾1個月加1倍，最高20倍登記費）`,refs:"A類aa4 / Q2土地法§73-1"},{title:"配偶拋棄繼承，應繼分怎麼計算",tag:"繼承",diff:"mid",scenario:"甲死亡，遺有A地，繼承人有：配偶乙、子女丙丁、甲之父母戊己。乙拋棄繼承，問丙丁及戊己各得多少？",question:"配偶拋棄繼承後，其他繼承人的應繼分如何計算？",laws:[{code:"民法 §1138",note:"繼承順序：第一順位→子女；第二順位→父母"},{code:"民法 §1144",note:"配偶與第一順位→均分；配偶拋棄後，其他繼承人仍依原順位分配"},{code:"民法 §1176",note:"配偶拋棄繼承→其應繼分不歸入，由其他繼承人按比例分"}],answer:`【計算】
配偶乙拋棄後：A地由第一順位子女丙丁繼承
丙、丁各得1/2（第一順位有人時，第二順位父母不繼承）

【注意】配偶拋棄≠其應繼分歸父母，父母仍無從繼承（因子女尚存，未到第二順位）`,refs:"A類aa2 / Q1民法§1176"},{title:"繼承農地，兄弟間公同共有要出售",tag:"繼承",diff:"hard",scenario:"甲死亡後，A農地由三子乙丙丁公同共有繼承。乙想出售自己的持分，但丙丁反對。乙問：公同共有的農地，可以用§34-1多數決出售嗎？",question:"繼承取得的公同共有農地，可否依土地法§34-1多數決處分？",laws:[{code:"民法 §1151",note:"繼承開始到分割前：遺產公同共有"},{code:"民法 §828",note:"公同共有物處分→應得公同共有人全體同意"},{code:"土地法 §34-1",note:"第五項雖規定公同共有準用，但民法§828更嚴格，繼承遺產仍需全體同意"},{code:"農業發展條例 §31",note:"農地移轉須移轉與自然人且作農業使用"}],answer:`【答案】：不能。
繼承取得的公同共有農地，雖然§34-1第五項規定準用公同共有，但依民法§828，公同共有物處分仍需全體同意。乙無法單獨或以多數決出售。

【解決途徑】
①協議分割：全體同意按比例分割為單獨所有
②裁判分割：向法院聲請強制分割（法院可裁定原物分割或拍賣）
③尋求調解：土地法§34-1第六項規定可申請地政機關調處`,refs:"A類aa3 / F類ff3 / I類ii1"},{title:"簽約後賣方一屋二賣，買方如何保護",tag:"買賣",diff:"mid",scenario:"甲將A房賣給乙，簽訂買賣契約並付了定金。甲之後又把A房賣給善意的丙並辦理移轉登記。乙如何保護自己？",question:"買方在辦理登記前，如何防範一屋二賣？已被二賣後如何求償？",laws:[{code:"土地登記規則 §136（土地法 §79-1）",note:"預告登記：簽約後立即辦，防止賣方再次移轉"},{code:"民法 §759-1",note:"第二項公信力：善意第三人丙取得登記→對乙有效"},{code:"民法 §184",note:"甲一屋二賣→故意侵權，乙可請求損害賠償"},{code:"民法 §249",note:"定金：甲違約→應加倍返還（定金2倍）"}],answer:`【事前預防】簽約後立即辦理預告登記（土地法§79-1）→賣方無法再移轉或設定抵押

【已被二賣的救濟】
①丙為善意且已完成登記→乙無法取回A房（§759-1公信力保護丙）
②乙可向甲請求：
  - 定金加倍返還（§249）
  - 損害賠償（§184侵權行為）
  - 履行利益（已付價款+仲介費+貸款費用等）

【教訓】：預告登記是買方最重要的保護工具，簽約當天就辦。`,refs:"B類bb1 / H類hh2 / Q3土地登記規則"},{title:"買入已設定最高限額抵押的房子",tag:"買賣",diff:"hard",scenario:"甲向銀行貸款，A房設定最高限額抵押1000萬（擔保循環借款）。甲將A房賣給乙，問：乙買入後抵押還在嗎？乙該如何處理？",question:"最高限額抵押的追及效力，買方如何在過戶前確認債務清償？",laws:[{code:"民法 §881-1",note:"最高限額抵押：擔保一定範圍的不特定債務（循環動用）"},{code:"民法 §867",note:"抵押物讓與不影響抵押權→乙買入後抵押權仍在（追及效力）"},{code:"土地登記規則 §97",note:"移轉登記應附：他項權利人（銀行）同意或塗銷抵押之文件"}],answer:`【關鍵風險】最高限額抵押的擔保金額可能比「帳面餘額」高（因為是循環動用），過戶後抵押跟著走，乙可能面臨甲欠銀行錢而A房被拍賣的風險。

【實務處理步驟】
①要求甲提供銀行「抵押債務清償證明」或銀行同意塗銷函
②約定「尾款於塗銷抵押後撥付」或「由代書代為清償貸款」
③向地政事務所辦理他項權利塗銷→確認抵押已塗銷後再完成過戶

【代書實務】：建議採「價金信託」，確保款項流向可控制。`,refs:"C類cc2 / B類bb1 / Q1民法§867"},{title:"優先購買權—共有人與基地所有人競合",tag:"買賣",diff:"hard",scenario:"甲乙共有土地，甲將其應有部分出賣給丙（非共有人）。乙（共有人）和丁（基地上建物的承租人）都主張優先購買。兩人的優先購買權如何排序？",question:"§34-1共有人優先購買 vs 土地法§104基地優先購買，誰優先？",laws:[{code:"土地法 §34-1 第四項",note:"共有人出賣應有部分→他共有人有優先購買（債權性質）"},{code:"土地法 §104",note:"基地出賣→地上承租人有優先購買（登記後為物權性質）"}],answer:`【排序】
實務見解：依§34-1立法意旨，共有人間的優先購買以「維護共有秩序」為目的，優先於§104的基地承租人優先購買。

→ 乙（共有人）優先於丁（承租人）

【通知規定】
甲應先書面通知乙，乙有15日表示（§34-1執行要點）；乙不行使後才輪到丁表示意願（通知10日，§104）

【注意】§34-1通知期限是「執行要點規定15日」，非法條本文，常考陷阱。`,refs:"B類bb5 / F類ff3 / P類ppp6"},{title:"租客拒不搬走，房東如何合法終止租約",tag:"租賃",diff:"mid",scenario:"甲將A房出租給乙，2年期限租約，已到期3個月但乙拒不搬離，甲應如何處理？",question:"定期租約到期後承租人拒不遷讓，房東的法律救濟途徑？",laws:[{code:"民法 §425",note:"買賣不破租賃→租約到期後不適用，乙已無法律依據續住"},{code:"民法 §455",note:"租賃期滿，承租人應返還租賃物"},{code:"民法 §456",note:"承租人逾期不返還，應給付相當於租金的損害賠償"}],answer:`【法律流程】
①發存證信函：通知乙租期已屆滿，限期搬遷
②未搬→向法院聲請「支付命令」或「給付租金+遷讓房屋」訴訟
③取得執行名義→申請法院強制執行（遷讓）

【損害賠償】乙在期滿後繼續占用期間，應給付相當於租金的金額（§456）

【注意】：如果甲收了到期後的租金→可能視為「默示續約」（成為不定期租約），要小心。

【加速處理】：可透過「調解委員會」調解，比訴訟快。`,refs:"M類mm1 / Q1民法§455-456"},{title:"房東賣房，新房東要趕租客搬家",tag:"租賃",diff:"mid",scenario:"甲將A房出租給乙（2年租約，已租1年），甲將A房賣給丙，丙以「所有人」身分要求乙搬家。乙有無保護？",question:"買賣不破租賃（§425）的適用條件及例外？",laws:[{code:"民法 §425",note:"第一項：租賃物交付後，縱讓與第三人，租約繼續有效。第二項：未公證+逾5年或未定期→例外，新房東不受拘束"}],answer:`【答案】：乙受保護（適用§425買賣不破租賃）

條件：①租賃物已交付②承租人占有中→兩者均符合，丙承受甲的房東地位，租約對丙繼續有效，丙不能趕乙走，直到租約到期。

【例外】（丙可以趕走乙的情形）：
①租約未經公證 AND 期限超過5年→不適用§425
②租約未經公證 AND 未定期限→不適用§425

【本案】：1年租約（未超5年），丙不能趕乙→乙可繼續住到租約到期。`,refs:"M類mm1 / Q1民法§425"},{title:"仲介幫買方談到優惠，私下向賣方收差價",tag:"仲介",diff:"mid",scenario:"仲介甲介紹乙購買A房，買賣成立後甲向買方乙收取服務費3%，另私下向賣方丙多收5%（超出公告標準）。乙與丙各有何救濟？",question:"仲介超收服務費、收取差價的法律責任？",laws:[{code:"不動產經紀業管理條例 §22",note:"買賣仲介費：買賣雙方合計不得超過成交價6%"},{code:"不動產經紀業管理條例 §24-1",note:"不得收取差價或私自取得委託人不動產相關權益"},{code:"民法 §571",note:"居間人吃兩家→喪失報酬請求權"}],answer:`【甲的違法行為】
①超收服務費（6%上限未遵守）→違反§22
②收取差價→違反§24-1
③居間人吃兩家→民法§571，甲喪失報酬請求權

【乙的救濟】：要求退還超收的費用+可向主管機關（縣市政府）舉報

【丙的救濟】：同上，要求退還多收的費用

【行政裁罰】：主管機關可依不動產經紀業管理條例裁罰仲介公司`,refs:"N類nn2 / R4 / Q1民法§571"},{title:"父母把房子賣給子女，被認定為贈與",tag:"稅務",diff:"mid",scenario:"甲將A地（公告現值800萬）以500萬元出售給其子乙（二親等內親屬間買賣），稅捐機關以顯著不相當代價認定視同贈與。問：應繳多少贈與稅？",question:"二親等間財產買賣視同贈與（§5第六款）如何課徵贈與稅？",laws:[{code:"遺贈稅法 §5 第六款",note:"二親等以內親屬間財產買賣→視同贈與（除非能證明確有支付）"},{code:"遺贈稅法 §22",note:"贈與稅：每年免稅額244萬；超過部分三段稅率（10/15/20%）"}],answer:`【課稅計算】
視同贈與金額 = 公告現值 − 實際成交價 = 800萬 − 500萬 = 300萬

（或以市價認定，這裡以公告現值估算）

贈與稅計算：
當年度甲已用免稅額244萬 → 剩餘 = 300 − 244 = 56萬（假設首次）
56萬 × 10%（未超2,500萬）= 5.6萬元贈與稅

【如何避免】：確實有支付→需提出金融轉帳紀錄（現金付款不被承認）`,refs:"D類dd4 / Q4遺贈稅法§5"},{title:"自用住宅賣出，土增稅如何計算",tag:"稅務",diff:"mid",scenario:"甲持有A房地10年，自用住宅使用，今年出售，成交價2000萬，前次移轉現值800萬（已換算物價指數為900萬）。問：土增稅多少？",question:"自用住宅出售土增稅計算（10%優惠稅率）及申請條件",laws:[{code:"土地稅法 §34",note:"自用住宅：稅率10%（一生一次），都市≦3公畝/非都市≦7公畝"},{code:"土地稅法 §33",note:"一般稅率：三段20/30/40%累進"}],answer:`【是否符合自用住宅10%】
條件：①自用住宅用地≦3公畝（都市）②出售前1年內未出租/營業③一生一次
→ 假設甲符合全部條件

【計算】
土地漲價總數額 = 成交現值 − 前次現值（物調後）
= 2000萬（土地部分，假設土地占60%）×0.6= 1200萬
前次土地現值（物調後）= 900萬×0.6 = 540萬
漲價 = 1200 − 540 = 660萬
土增稅 = 660萬 × 10% = 66萬

（若不適用自用住宅→按三段累進：未達100%漲幅→20%，即660/540=122%→部分適用30%）

【申請】：移轉登記前30日向稅捐稽徵機關申報`,refs:"D類dd1 / Q4土地稅法§34"},{title:"繼承後賣地，房地合一稅如何計算",tag:"稅務",diff:"hard",scenario:"甲的父親在108年以300萬取得A房地，111年父親死亡，甲繼承A房地。114年甲以700萬出售。問：甲應繳多少房地合一稅？",question:"繼承取得的房地出售，持有期間如何計算？稅率適用？",laws:[{code:"所得稅法 §4-4",note:"105年後取得之房地→課房地合一稅"},{code:"所得稅法 §14-8",note:"持有期間合併計算：繼承人繼承被繼承人的持有期間"}],answer:`【持有期間計算】
甲繼承父親取得，持有期間從「父親108年取得」算起，到「甲114年出售」= 6年
→ 超過5年未逾10年 → 稅率20%

【稅基計算】
課稅所得 = 成交價700萬 − 取得成本300萬 − 相關費用（假設50萬）
= 350萬

房地合一稅 = 350萬 × 20% = 70萬

【注意】：繼承取得→免土增稅但需繳房地合一稅（105年後取得適用）

【申報】：完成移轉登記次日起30日內，向登記地國稅局申報（§14-7）`,refs:"D類dd2 / Q4所得稅法§14-8"},{title:"共有土地應有部分設定抵押後，申請裁判分割",tag:"共有",diff:"hard",scenario:"甲乙丙三人共有A地，甲的應有部分已向銀行設定抵押。三人協議分割不成，乙向法院聲請裁判分割。問：抵押權如何處理？",question:"共有不動產設定抵押後裁判分割，抵押權效力如何？",laws:[{code:"民法 §824-1 第二項",note:"原則：抵押權按應有部分比例轉載各分割土地。例外：銀行同意/已參加訴訟/告知未參加→移存甲分得部分"},{code:"土地登記規則 §107",note:"辦理分割登記時，各承受人就分得部分應為抵押權轉載"}],answer:`【原則處理】（釋字671號）
裁判分割後，銀行的抵押權按甲原應有部分（1/3）比例，分別轉載到分割後各宗土地。
→ 甲的抵押不只在甲分得的土地，也在乙丙分得的土地上（按比例）

【例外：抵押僅在甲分得部分的條件】
①銀行同意分割，OR
②銀行已參加裁判分割訴訟，OR
③乙向銀行發出告知訴訟通知，銀行未參加

【實務建議】：辦理分割登記前，應通知抵押權人（銀行），由銀行選擇是否參加，以確定抵押的最終歸屬。`,refs:"C類cc1 / F類ff2 / Q1民法§824-1"},{title:"受託人死亡，信託財產被繼承人主張繼承",tag:"信託",diff:"mid",scenario:"甲委託乙辦理A地自益信託，A地登記為受託人乙名下。乙死亡，乙的繼承人丙主張A地是乙的遺產，要求辦理繼承登記。甲如何反駁？",question:"信託財產不屬受託人遺產（信託法§11），甲的法律依據及救濟？",laws:[{code:"信託法 §11",note:"受託人死亡→信託財產不屬於其遺產（三種情形均不屬於）"},{code:"信託法 §4",note:"信託登記是對抗要件：已辦信託登記，任何第三人均不能對抗甲"},{code:"信託法 §36",note:"受託人死亡→由委託人另行指定新受託人，信託關係繼續"}],answer:`【甲的主張】
①依信託法§11：A地是信託財產，受託人乙死亡，A地不屬於乙的遺產
②A地已辦理信託登記（§4）→公示效力，丙明知（或可知）是信託財產，不能主張繼承

【處理流程】
甲依§36指定新受託人丁→向地政事務所辦理受託人變更登記
→ 信託繼續，甲的利益受完整保護

【若丙已辦了繼承登記】→甲可依民事訴訟主張塗銷，或向法院聲請撤銷`,refs:"E類ee2 / E類ee3 / Q1信託法§11"},{title:"預售屋換約轉讓，建商或買方違法嗎",tag:"預售屋",diff:"mid",scenario:"甲向建商乙購買預售屋，付了50萬訂金。甲因財務問題想把「買賣契約」轉讓給丙（換約），建商乙不願配合。問：換約是否合法？若強行換約有何後果？",question:"111年平均地權條例修法後，預售屋換約的法律規定及例外",laws:[{code:"平均地權條例 §47-4",note:"預售屋禁止換約：買受人不得讓與或轉售預售屋契約。例外：配偶/直系親屬或離婚財產分配"},{code:"平均地權條例 §47-4 第二項",note:"違反者：處50~300萬罰鍰"}],answer:`【111年修法後】：全面禁止換約
甲不能把預售屋契約轉讓給丙（例外：配偶/直系親屬/離婚才可）

【若強行換約的後果】
①行政裁罰：甲（轉讓人）可能被罰50~300萬元
②建商乙不用配合辦理換約，契約依然在甲與乙之間

【甲的選項】
①解除契約（依買賣契約違約條款），乙退回訂金（扣除違約金）
②若是直系親屬（如兒子丁）→可以換約

【注意】：實價登錄申報→預售屋簽約後30日內須申報（§47-1），換約也需申報`,refs:"N類nn4 / R3平均地權§47-4"},{title:"預售屋建商倒閉，買方如何保障",tag:"預售屋",diff:"hard",scenario:"甲向建商乙購買預售屋，簽約並依履約保證機制付款。乙公司財務危機，可能無法完工。甲如何保障自身權益？",question:"預售屋履約保證機制的法律依據及買方保護措施",laws:[{code:"不動產經紀業管理條例 §26-1",note:"預售屋交付款項保管應採信託方式或其他保障方法"},{code:"消費者保護法 §17",note:"主管機關公告之預售屋定型化契約應記載事項（含履約保證）"}],answer:`【履約保證四種方式（依規定選一）】
①價金信託（最常見）：買方款項存信託專戶，交屋後才撥付建商
②價金融資：銀行提供擔保
③同業連帶保證：其他建商連帶保證
④屋款交付連帶保證：銀行連帶保證

【建商倒閉時的處理】
若採價金信託→款項在信託帳戶，不屬建商財產，不受破產影響
→ 甲可申請退款或另找建商接手

【無履約保證的風險】：買方僅有一般債權，建商破產後難以取回

【查詢方式】：購屋前要求建商提供信託銀行証明文件`,refs:"N類nn3 / R4不動產經紀業§26-1"},{title:"農地想賣給公司法人，可以嗎",tag:"農地",diff:"mid",scenario:"甲有農地一筆，某開發公司（法人）想以高價購買，甲想辦理移轉。問：農地可以賣給法人嗎？如果賣了，免土增稅還適用嗎？",question:"農地農有原則：農地移轉給法人是否合法？稅務影響？",laws:[{code:"土地稅法 §39-2",note:"農地不課土增稅條件：移轉與「自然人」。移轉給法人→不符合"},{code:"農業發展條例 §31",note:"農業用地移轉：得申請不課徵土增稅（限自然人）"}],answer:`【答案】：農地可以賣給法人，但有條件限制。

【法律效力】
農業用地移轉給法人→合法（沒有絕對禁止規定，但需注意農業使用義務）

【稅務影響】
移轉給法人→不符合「移轉與自然人」要件→不得申請不課徵土增稅
→ 甲必須繳納土增稅（依三段累進稅率20/30/40%）

【農業使用義務】
移轉後農地若不繼續農業使用，主管機關可責令回復原狀

【建議】：若甲想免土增稅，應限制移轉對象為自然人農民`,refs:"I類ii1 / D類dd1 / Q4土地稅法§39-2"},{title:"公設保留地要怎麼處理最划算",tag:"稅務",diff:"mid",scenario:"甲持有一筆已劃設為公設保留地的土地（都市計畫道路用地），長期沒有使用。問：稅務上有何優惠？如何處分最有利？",question:"公設保留地的地價稅優惠、移轉免土增稅，及容積移轉的選擇",laws:[{code:"土地稅法 §19",note:"公設保留地建築使用→6‰地價稅；完全未使用且隔離→免徵"},{code:"都市計畫法 §50-1",note:"公設保留地免遺產稅及贈與稅"},{code:"土地稅法 §39 第二項",note:"公設保留地移轉→免徵土地增值稅"},{code:"都市計畫法 §83-1",note:"容積移轉：公設保留地可將容積賣給接受基地"}],answer:`【稅務優惠一覽】
①地價稅：完全未使用且隔離→免徵
②遺產稅：免徵（§50-1）
③贈與稅：免徵（§50-1）
④土增稅：移轉時→免徵（§39）

【如何處分？三個選項】
1️⃣ 等政府徵收：補償按市價（§30），並可選擇抵價地
2️⃣ 出售給私人：免土增稅，市場上可找願意等待徵收的投資人
3️⃣ 容積移轉（最推薦）：將甲地的建築容積移轉給其他建地，甲可獲得現金補償，不需等政府徵收

【建議】：容積移轉目前市場有需求，可詢問建設公司收購意願`,refs:"D類dd6 / K類kk1 / D類dd1"},{title:"管理委員會可以停水停電趕違規住戶嗎",tag:"公寓大廈",diff:"mid",scenario:"某公寓住戶甲長期噪音擾鄰，管委會已多次警告無效。管委會欲停止供水供電，強制甲配合。問：管委會有此權力嗎？法律依據？",question:"公寓大廈管委會對違規住戶的強制措施：停水停電是否合法？",laws:[{code:"公寓大廈管理條例 §16",note:"住戶違規→管委會為必要措施後仍不排除妨害，得請求停止供水供電"},{code:"公寓大廈管理條例 §22",note:"住戶違反規約情節重大者，可訴請法院強制遷離"}],answer:`【答案】：有條件可以，但需先履行法定程序。

【合法停水停電的前提】
①住戶違規事實確認（噪音擾鄰）
②管委會已為必要措施（書面警告/調解嘗試）
③住戶仍不排除妨害
→ 在以上條件下，管委會可向供水供電機構申請停止供應

【更強的手段（情節重大）】
§22：管委會可訴請法院，判決要求住戶遷離（出租戶→通知房東終止租約；自住戶→強制遷離）

⚠️ 112年1月1日修正：成年由20歲改為18歲。影響所有涉及行為能力的法律行為——18歲即可獨立簽訂買賣契約、設定抵押等。`},{code:"民法 §13",title:"行為能力三分類 ★",freq:"high",detail:`【全國法規原文】
第一項：未滿七歲之未成年人，無行為能力。
第二項：滿七歲以上之未成年人，有限制行為能力。
第三項：未成年人已結婚者，有行為能力。

三類：無（未滿7歲/受監護宣告）→限制（7歲以上未成年）→完全（成年18歲）`,key_paras:[1,2,3]},{code:"民法 §14",title:"受監護宣告（無行為能力）",freq:"mid",detail:`【全國法規原文】對於因精神障礙或其他心智缺陷，致不能為意思表示或受意思表示，或不能辨識其意思表示之效果者，法院得因本人、配偶、四親等內之親屬、最近一年有同居事實之其他親屬、檢察官、主管機關或社會福利機構之聲請，為監護之宣告。

⚠️ 受監護宣告→無行為能力；受輔助宣告（§15-1）→限制行為能力。`,key_paras:[1]},{code:"民法 §71",title:"違反強制規定→無效 ★",freq:"high",detail:`【全國法規原文】
第一項：法律行為，違反強制或禁止之規定者，無效。但其規定並不以之為無效者，不在此限。
第二項：前項情形，法律行為之一部分無效者，全部皆為無效。但除去該部分亦可成立者，則其他部分，仍為有效。

強制規定→違反無效；任意規定→當事人可特約排除。`,key_paras:[1,2]},{code:"民法 §86",title:"真意保留（心中保留）",freq:"low",detail:`【全國法規原文】表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示，不因此無效。但其情形為相對人所明知者，不在此限。

⚠️ 對不知情相對人→有效；相對人明知→無效。`},{code:"民法 §87",title:"虛偽意思表示（通謀虛偽）★",freq:"high",detail:`【全國法規原文】
第一項：表意人與相對人通謀而為虛偽意思表示者，其意思表示無效。但不得以其無效對抗善意第三人。
第二項：虛偽意思表示，隱藏他項法律行為者，適用關於該項法律行為之規定。

⚠️ 虛偽契約→無效，但善意第三人受保護。隱藏行為（如假買賣真贈與）依隱藏行為的規定。`,key_paras:[1,2]},{code:"民法 §88",title:"錯誤之意思表示 ★",freq:"mid",detail:`【全國法規原文】
第一項：意思表示之內容有錯誤，或表意人若知其情事即不為意思表示者，表意人得將其意思表示撤銷之。但以其錯誤或不知情事，非由表意人自己之過失者為限。
第二項：當事人之資格或物之性質，若交易上認為重要者，其錯誤，視為意思表示內容之錯誤。`,key_paras:[1,2]},{code:"民法 §92",title:"詐欺/脅迫之撤銷 ★",freq:"high",detail:`【全國法規原文】

第一項：契約之要約人，因要約而受拘束。但要約當時預先聲明不受拘束，或依其情形或事件之性質，可認當事人無受其拘束之意思者，不在此限。

不動產物權移轉→需書面（§758第二項）
租賃超過1年→需書面（§422）

第一項：因故意或過失，不法侵害他人之權利者，負損害賠償責任。故意以背於善良風俗之方法，加損害於他人者亦同。

第一項：契約未成立時，當事人為準備或商議訂立契約而有左列情形之一者，對於非因過失而信契約能成立致受損害之他方當事人，負賠償責任：
一、就訂約有重要關係之事項，對他方之詢問，惡意隱匿或為不實之說明者。

第一項：以不能之給付為契約標的者，其契約為無效。但其不能情形可以除去，而當事人訂約時並預期於不能之情形除去後為給付者，其契約有效。

⚠️ 消費者保護法§11的補充規定，保護消費者對抗不公平定型化條款（如預售屋契約）。`},{code:"民法 §354",title:"物之瑕疵擔保 ★",freq:"high",detail:`【全國法規原文】
第一項：出賣人應擔保其物依第三百七十三條之規定危險移轉於買受人時無滅失或減少其價值之瑕疵，亦無滅失或減少其通常效用或契約預定效用之瑕疵。但減少之程度，無關重要者，不得視為瑕疵。
